sentinel_connector.settings:
  type: config_object
  label: 'Sentinel Connector settings'
  mapping:
    site_uuid:
      type: string
      label: 'Site UUID'
    report_scope:
      type: string
      label: 'Report scope'
    enabled:
      type: boolean
      label: 'Enable cron sync'
    report_config_drift:
      type: boolean
      label: 'Report configuration drift'
    report_upgrade_status:
      type: boolean
      label: 'Report Upgrade Status readiness'
    report_platform:
      type: boolean
      label: 'Report platform versions'
    api_key_id:
      type: string
      label: 'Key module key holding the API key'
