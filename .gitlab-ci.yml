# Use Drupal.org's maintained build, validation, and test jobs.
include:
  - project: project/gitlab_templates
    ref: main
    file:
      - /includes/include.drupalci.main.yml
      - /includes/include.drupalci.variables.yml
      - /includes/include.drupalci.workflows.yml

variables:
  _TARGET_PHP: '8.3'
  OPT_IN_TEST_CURRENT: '1'
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  OPT_IN_TEST_NEXT_MAJOR: '0'
  _AUTORUN_CURRENT: 'all'
  _AUTORUN_PREVIOUS_MAJOR: 'all'
  # Includes Unit (with payload contracts) and Kernel tests.
  _PHPUNIT_TESTGROUPS: '--all'

composer:
  allow_failure: false

composer (previous major):
  allow_failure: false
  variables:
    # The module requires PHP 8.3, above Drupal 10's default minimum.
    PHP_VERSION: '8.3'

phpunit:
  allow_failure: false

phpunit (previous major):
  allow_failure: false
