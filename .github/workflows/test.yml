name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install Drupal core-dev scaffold
        run: |
          composer create-project drupal/recommended-project:^10.3 web --no-interaction --no-install
          cd web
          composer config minimum-stability dev
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer require --dev drupal/core-dev:^10.3 -W --no-interaction
          composer require --dev drupal/coder:^8.3 dealerdirect/phpcodesniffer-composer-installer mglaman/phpstan-drupal:^1.2 phpstan/extension-installer:^1.3 drush/drush:^12.5 drupal/config_ignore:^3.3 drupal/config_split:^2.0 -W --no-interaction
          # The configuration pull request submodule and its Git host clients.
          composer require --dev drupal/config_pr:^3.0 drupal/key:^1.18 m4tthumphrey/php-gitlab-api:^12.0 php-http/guzzle7-adapter:^1.0 http-interop/http-factory-guzzle:^1.2 -W --no-interaction
          mkdir -p web/modules/custom/sentinel_connector
          rsync -a --exclude web --exclude .git "$GITHUB_WORKSPACE"/ web/modules/custom/sentinel_connector/
      - name: PHPCS
        run: cd web && vendor/bin/phpcs --standard=Drupal,DrupalPractice --extensions=php,module,install web/modules/custom/sentinel_connector/src web/modules/custom/sentinel_connector/sentinel_connector.module web/modules/custom/sentinel_connector/sentinel_connector.install web/modules/custom/sentinel_connector/tests web/modules/custom/sentinel_connector/modules
      - name: PHPStan
        run: cd web && vendor/bin/phpstan analyse -c web/modules/custom/sentinel_connector/phpstan.neon.dist web/modules/custom/sentinel_connector/src web/modules/custom/sentinel_connector/tests web/modules/custom/sentinel_connector/sentinel_connector.module web/modules/custom/sentinel_connector/sentinel_connector.install web/modules/custom/sentinel_connector/modules --level=6 --memory-limit=1G

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { drupal: '^10.3', php: '8.3' }
          - { drupal: '^11', php: '8.4' }
          - { drupal: '^12@beta', php: '8.5' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Build Drupal site with the module
        run: |
          composer create-project drupal/recommended-project:${{ matrix.drupal }} web --no-interaction --no-install
          cd web
          composer config minimum-stability dev
          # core-dev brings the test framework; justinrainbow/json-schema (used by
          # the payload contract test) is required explicitly but unversioned so
          # composer picks a release compatible with core-dev's own constraint.
          # -W lets composer resolve the lock that create-project --no-install left.
          # Config Ignore and Config Split prove the drift report respects them.
          composer require --dev drupal/core-dev:${{ matrix.drupal }} justinrainbow/json-schema drupal/config_ignore:^3.3 drupal/config_split:^2.0 -W --no-interaction
          # The configuration pull request submodule and its Git host clients.
          composer require --dev drupal/config_pr:^3.0 drupal/key:^1.18 m4tthumphrey/php-gitlab-api:^12.0 php-http/guzzle7-adapter:^1.0 http-interop/http-factory-guzzle:^1.2 -W --no-interaction
          # Drupal 12 release archives omit core's test framework.
          # Fetch the exact installed source revision when it is absent.
          if [ ! -f web/core/tests/bootstrap.php ]; then
            core_ref=$(composer show drupal/core --format=json | jq -r '.source.reference')
            git init "$RUNNER_TEMP/drupal-core-tests"
            git -C "$RUNNER_TEMP/drupal-core-tests" remote add origin https://github.com/drupal/core.git
            git -C "$RUNNER_TEMP/drupal-core-tests" fetch --depth=1 origin "$core_ref"
            git -C "$RUNNER_TEMP/drupal-core-tests" checkout --detach FETCH_HEAD
            rsync -a --exclude .git "$RUNNER_TEMP/drupal-core-tests/" web/core/
          fi
          mkdir -p web/modules/custom/sentinel_connector
          rsync -a --exclude web --exclude .git "$GITHUB_WORKSPACE"/ web/modules/custom/sentinel_connector/
      - name: PHPUnit (Unit + contract)
        run: |
          cd web/web
          ../vendor/bin/phpunit -c core/phpunit.xml.dist \
            modules/custom/sentinel_connector/tests/src/Unit
          ../vendor/bin/phpunit -c core/phpunit.xml.dist \
            modules/custom/sentinel_connector/modules/sentinel_connector_config_pr/tests/src/Unit
      - name: PHPUnit (Kernel)
        env:
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          BROWSERTEST_OUTPUT_DIRECTORY: /tmp/sentinel-browser-output
        run: |
          mkdir -p "$BROWSERTEST_OUTPUT_DIRECTORY"
          cd web/web
          ../vendor/bin/phpunit -c core/phpunit.xml.dist \
            modules/custom/sentinel_connector/tests/src/Kernel
          ../vendor/bin/phpunit -c core/phpunit.xml.dist \
            modules/custom/sentinel_connector/modules/sentinel_connector_config_pr/tests/src/Kernel
