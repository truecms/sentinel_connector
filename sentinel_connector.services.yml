services:
  Drupal\sentinel_connector\Hook\SentinelHooks:
    class: Drupal\sentinel_connector\Hook\SentinelHooks
    arguments: ['@service_container']

  logger.channel.sentinel_connector:
    parent: logger.channel_base
    arguments: ['sentinel_connector']

  Drupal\sentinel_connector\PayloadBuilder:
    class: Drupal\sentinel_connector\PayloadBuilder
    factory: ['@sentinel_connector.payload_builder_factory', 'create']

  sentinel_connector.payload_builder_factory:
    class: Drupal\sentinel_connector\PayloadBuilderFactory
    arguments:
      - '@extension.list.module'
      - '@request_stack'
      - '%app.root%'
      - '@Drupal\sentinel_connector\PlatformCollector'
      - '@Drupal\sentinel_connector\ConfigDriftCollector'
      - '@config.factory'

  Drupal\sentinel_connector\ConfigDriftCollector:
    class: Drupal\sentinel_connector\ConfigDriftCollector
    arguments:
      - '@config.storage.export.manager'
      - '@config.factory'
      - '@module_handler'
      - '@settings'
      - '@lock'
      - '@datetime.time'

  Drupal\sentinel_connector\PlatformCollector:
    class: Drupal\sentinel_connector\PlatformCollector
    arguments: ['@state', '@request_stack', '@database', '@datetime.time']

  Drupal\sentinel_connector\EventSubscriber\WebServerSubscriber:
    class: Drupal\sentinel_connector\EventSubscriber\WebServerSubscriber
    arguments: ['@Drupal\sentinel_connector\PlatformCollector']
    tags:
      - { name: event_subscriber }

  Drupal\sentinel_connector\ApiKeyResolver:
    class: Drupal\sentinel_connector\ApiKeyResolver
    arguments: ['@settings', '@state', '@config.factory', '@?key.repository']

  Drupal\sentinel_connector\ApiBaseUrlResolver:
    class: Drupal\sentinel_connector\ApiBaseUrlResolver
    arguments: ['@settings', '@config.factory', '@state']

  Drupal\sentinel_connector\SiteUuidResolver:
    class: Drupal\sentinel_connector\SiteUuidResolver
    arguments: ['@settings', '@config.factory']

  Drupal\sentinel_connector\SendingSwitch:
    class: Drupal\sentinel_connector\SendingSwitch
    arguments: ['@settings']

  Drupal\sentinel_connector\ConnectionChecker:
    class: Drupal\sentinel_connector\ConnectionChecker
    arguments:
      - '@Drupal\sentinel_connector\SentinelClient'
      - '@Drupal\sentinel_connector\ApiBaseUrlResolver'
      - '@Drupal\sentinel_connector\SiteUuidResolver'
      - '@Drupal\sentinel_connector\ApiKeyResolver'
      - '@Drupal\sentinel_connector\SendingSwitch'
      - '@Drupal\sentinel_connector\PushLimitFormatter'
      - '@state'
      - '@datetime.time'
      - '@logger.channel.sentinel_connector'
      - '@string_translation'

  Drupal\sentinel_connector\ApiKeyMigrator:
    class: Drupal\sentinel_connector\ApiKeyMigrator
    arguments: ['@state', '@config.factory', '@entity_type.manager', '@module_handler', '@Drupal\sentinel_connector\ApiKeyResolver']

  Drupal\sentinel_connector\SentinelClient:
    class: Drupal\sentinel_connector\SentinelClient
    arguments: ['@http_client', '@datetime.time']

  Drupal\sentinel_connector\PushLimitFormatter:
    class: Drupal\sentinel_connector\PushLimitFormatter
    arguments: ['@date.formatter', '@config.factory', '@string_translation']

  Drupal\sentinel_connector\PushHealth:
    class: Drupal\sentinel_connector\PushHealth
    arguments:
      - '@Drupal\sentinel_connector\SyncService'
      - '@Drupal\sentinel_connector\PushLimitFormatter'
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@url_generator'
      - '@Drupal\sentinel_connector\ApiBaseUrlResolver'
      - '@Drupal\sentinel_connector\ConnectionChecker'
      - '@string_translation'

  Drupal\sentinel_connector\SyncService:
    class: Drupal\sentinel_connector\SyncService
    arguments:
      - '@config.factory'
      - '@state'
      - '@Drupal\sentinel_connector\PayloadBuilder'
      - '@Drupal\sentinel_connector\ApiKeyResolver'
      - '@Drupal\sentinel_connector\SentinelClient'
      - '@datetime.time'
      - '@logger.channel.sentinel_connector'
      - '@Drupal\sentinel_connector\ApiBaseUrlResolver'
      - '@Drupal\sentinel_connector\SiteUuidResolver'
      - '@Drupal\sentinel_connector\SendingSwitch'
